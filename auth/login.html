<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Mockmate</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.49/build/spline-viewer.js"></script>
  <script type="module" src="login.js" defer></script>
  <script type="module" src="index.html" defer></script>
</head>
<body>

  <!-- Spline Animated Background -->
  <spline-viewer id="bg-spline" url="https://prod.spline.design/sm6rvDlqud0cPIhH/scene.splinecode"></spline-viewer>

  <!-- Login Form Container -->
  <div class="login-container">
    <h2>Welcome Back to Mockmate</h2>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />

      <button id="login" type="submit" class="btn-34"><span>Log In</span></button>
    </form>

    <div class="form-footer">
      <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>
  </div>
</body>
</html>
